// proto/recorder.proto
syntax = "proto3";
package recorder;
option go_package = "kyc/proto/recorder;recorderpb";

enum Kind { VIDEO_AU = 0; USER_PCM = 1; AGENT_PCM = 2; }

message Frame {
  string session_id = 1;
  Kind   kind       = 2;
  uint64 ts_us      = 3;   // monotonic microseconds since this stream's first frame
  bytes  data       = 4;   // VIDEO_AU: one H264 access unit (Annex-B). *_PCM: s16le mono 48kHz
  uint64 call_us    = 5;   // SHARED per-call origin: microseconds since call t=0, same clock on all
                           // three streams. The recorder positions PCM by this (sample 0 == call_us 0,
                           // gaps filled with silence) and derives the video lip-sync offset from the
                           // first keyframe's call_us. Load-bearing for audio AND video alignment.
}
message Ack { uint64 frames = 1; }

service Recorder {
  rpc RecordStream(stream Frame) returns (Ack);   // client-streaming: many Frames in, one Ack out
}